name: publish

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only pushes to main and published releases are published. PR, merge queue and other branch
    # builds are not: a PR image can be published on demand via publish-pr-multiarch.yml.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'release' ||
           (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) }}
    # Run publishes for the same ref one at a time, so an older main build that finishes last can't
    # move the main tag back. Waiting runs are replaced by newer ones; releases each get their own group.
    concurrency:
      group: publish-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: build and push docker image (main)
        if: ${{ github.event.workflow_run.event == 'push' }}
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64,linux/arm64/v8
          tags: getfider/fider:main
          cache-from: type=gha
          # Cache export runs after the image is pushed; a failure there (e.g. two publish
          # runs racing for the same cache key) must not mark a successful publish as failed.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: build and push docker image (push tag)
        if: ${{ github.event.workflow_run.event == 'release' }}
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          build-args: |
            COMMITHASH=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ github.event.workflow_run.display_title }}
          platforms: linux/amd64,linux/arm64/v8
          tags: getfider/fider:${{ github.event.workflow_run.display_title }}
          cache-from: type=gha
          # Cache export runs after the image is pushed; a failure there (e.g. two publish
          # runs racing for the same cache key) must not mark a successful publish as failed.
          cache-to: type=gha,mode=max,ignore-error=true

      # stable follows GitHub's "latest" release, which excludes pre-releases and releases not set
      # as latest. Checking after the build means re-runs and slower, older builds can't move it back.
      - name: point stable at this release if it is the latest
        if: ${{ github.event.workflow_run.event == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          IMAGE_TAG: ${{ github.event.workflow_run.display_title }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create -t getfider/fider:stable "getfider/fider:$IMAGE_TAG"
          else
            echo "::notice::Not moving stable: $RELEASE_TAG is not the latest release ($latest)"
          fi
